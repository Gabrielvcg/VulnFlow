name: VulnFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend, agent, contracts, and Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            pom.xml
            processing-core/pom.xml
            backend/pom.xml
            agent/pom.xml
            aws/aws-adapters/pom.xml
            aws/lambda-processor/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web console
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          ! grep -R -E 'AKIA[0-9A-Z]{16}|VULNFLOW_API_KEY|BEGIN .*PRIVATE KEY' dist

      - name: Enforce landing Lighthouse budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./web/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Reject committed credentials
        shell: bash
        run: |
          if git grep -I -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo "A credential-like value is committed"
            exit 1
          fi

      - name: Verify all Java modules and build artifacts
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f pom.xml verify

      - name: Require PostgreSQL integration tests
        run: |
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("backend/target/failsafe-reports/TEST-*.xml")
          tests = 0
          skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              tests += int(root.attrib.get("tests", 0))
              skipped += int(root.attrib.get("skipped", 0))

          print(f"Failsafe integration tests: total={tests}, skipped={skipped}")
          if tests == 0 or skipped != 0:
              sys.exit("PostgreSQL integration tests did not all run")
          PY

      - name: Require Lambda package and offline AWS demo
        shell: bash
        run: |
          test -f aws/lambda-processor/target/vulnflow-lambda-processor-0.4.9.jar
          test -f backend/target/failsafe-reports/TEST-com.vulnflow.AwsExecutionPathIT.xml
          forbidden_aws_test_pattern='local''stack|endpoint''Override'
          ! git grep -I -E "$forbidden_aws_test_pattern" -- ':!docs/**'

      - name: Confirm VPS remains local mode
        shell: bash
        run: |
          ! grep -E 'SPRING_PROFILES_ACTIVE:.*aws' deploy/docker-compose.prod.yml
          grep -Eq 'SPRING_PROFILES_ACTIVE: prod,aws' deploy/docker-compose.aws.yml

      - name: Validate production Compose contract
        shell: bash
        env:
          POSTGRES_DB: vulnflow
          POSTGRES_USER: vulnflow
          POSTGRES_PASSWORD: ci-only
          VULNFLOW_API_KEY: ci-only
          VULNFLOW_POSTGRES_VOLUME: vulnflow-ci-postgres
          VULNFLOW_REPORTS_VOLUME: vulnflow-ci-reports
          VULNFLOW_AGENT_VOLUME: vulnflow-ci-agent
          VULNFLOW_AGENT_TARGETS_FILE: /tmp/vulnflow-targets.yml
          VULNFLOW_AGENT_ID: ci-agent
          VULNFLOW_BACKEND_IMAGE: example.invalid/vulnflow-backend:ci
          VULNFLOW_AGENT_IMAGE: example.invalid/vulnflow-agent:ci
          VULNFLOW_WEB_IMAGE: example.invalid/vulnflow-web:ci
          AWS_REGION: eu-west-1
          VULNFLOW_S3_BUCKET: vulnflow-ci-reports
          VULNFLOW_SQS_QUEUE_URL: https://sqs.eu-west-1.amazonaws.com/160172542031/vulnflow-ci-ingestion
          VULNFLOW_SQS_DLQ_URL: https://sqs.eu-west-1.amazonaws.com/160172542031/vulnflow-ci-ingestion-dlq
          VULNFLOW_DYNAMODB_TABLE: vulnflow-ci-results
          VULNFLOW_AWS_CREDENTIALS_DIRECTORY: /tmp/vulnflow-aws
        run: |
          docker compose -f deploy/docker-compose.prod.yml config --format json \
            > "$RUNNER_TEMP/vulnflow-compose.json"
          docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.aws.yml config --format json \
            > "$RUNNER_TEMP/vulnflow-compose-aws.json"
          python - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "vulnflow-compose.json"), encoding="utf-8") as stream:
              compose = json.load(stream)

          agent = compose["services"]["agent"]
          backend = compose["services"]["backend"]
          web = compose["services"]["web"]
          assert agent["environment"]["TMPDIR"] == "/var/lib/vulnflow-agent/tmp"
          assert agent["read_only"] is True
          assert all("docker.sock" not in str(volume) for volume in agent["volumes"])
          assert backend["environment"]["SPRING_PROFILES_ACTIVE"] == "prod"
          assert "AWS_PROFILE" not in backend["environment"]
          assert web["read_only"] is True
          assert web["image"] == "example.invalid/vulnflow-web:ci"

          with open(os.path.join(os.environ["RUNNER_TEMP"], "vulnflow-compose-aws.json"), encoding="utf-8") as stream:
              aws_compose = json.load(stream)

          aws_backend = aws_compose["services"]["backend"]
          assert aws_backend["environment"]["SPRING_PROFILES_ACTIVE"] == "prod,aws"
          assert aws_backend["environment"]["AWS_PROFILE"] == "vulnflow-roles-anywhere"
          assert aws_backend["environment"]["AWS_EC2_METADATA_DISABLED"] == "true"
          assert not any(name in aws_backend["environment"] for name in (
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"))
          assert any(volume.get("target") == "/run/vulnflow-aws" and volume.get("read_only") is True
                     for volume in aws_backend["volumes"])
          PY

      - name: Build backend image
        run: |
          docker build --file backend/Dockerfile --tag vulnflow-backend:ci .
          test "$(docker run --rm --entrypoint /usr/local/bin/aws_signing_helper vulnflow-backend:ci version)" = "1.8.4"

      - name: Build agent image
        run: docker build --tag vulnflow-agent:ci agent

      - name: Build web image
        run: docker build --tag vulnflow-web:ci web

  terraform_validate:
    name: Format and validate temporary AWS Terraform
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: |
          terraform -chdir=infrastructure/aws fmt -check -recursive
          terraform -chdir=infrastructure/bootstrap fmt -check
          terraform -chdir=infrastructure/identity-bootstrap fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: |
          terraform -chdir=infrastructure/aws init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure/identity-bootstrap init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform without AWS credentials
        run: |
          terraform -chdir=infrastructure/aws validate
          terraform -chdir=infrastructure/bootstrap validate
          terraform -chdir=infrastructure/identity-bootstrap validate

      - name: Test Terraform plan invariants without AWS credentials
        run: |
          terraform -chdir=infrastructure/aws test
          terraform -chdir=infrastructure/identity-bootstrap test

  publish_images:
    name: Publish immutable images
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, terraform_validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      agent_image: ${{ steps.images.outputs.agent_image }}
      web_image: ${{ steps.images.outputs.web_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable image references
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend_image=ghcr.io/${owner}/vulnflow-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "agent_image=ghcr.io/${owner}/vulnflow-agent:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${owner}/vulnflow-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend_image }}
          cache-from: type=gha,scope=vulnflow-backend
          cache-to: type=gha,mode=max,scope=vulnflow-backend

      - name: Build and publish agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: agent
          push: true
          tags: ${{ steps.images.outputs.agent_image }}
          cache-from: type=gha,scope=vulnflow-agent
          cache-to: type=gha,mode=max,scope=vulnflow-agent

      - name: Build and publish web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: web
          push: true
          tags: ${{ steps.images.outputs.web_image }}
          cache-from: type=gha,scope=vulnflow-web
          cache-to: type=gha,mode=max,scope=vulnflow-web

  deploy_production:
    name: Deploy production VPS
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.VPS_DEPLOY_ENABLED == 'true'
    needs: publish_images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    concurrency:
      group: vulnflow-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo "VPS_HOST is missing or invalid"; exit 1; }
          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "VPS_PORT is missing or invalid"
            exit 1
          fi
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "VPS_USER is missing or invalid"; exit 1; }
          if [[ ! "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ \
              || "$VPS_DEPLOY_PATH" == "/" \
              || "$VPS_DEPLOY_PATH" == *"//"* \
              || "$VPS_DEPLOY_PATH" == *"/../"* \
              || "$VPS_DEPLOY_PATH" == *"/.." ]]; then
            echo "VPS_DEPLOY_PATH is missing or unsafe"
            exit 1
          fi
          [[ -n "$VPS_SSH_PRIVATE_KEY" ]] || { echo "VPS_SSH_PRIVATE_KEY is missing"; exit 1; }
          [[ -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo "VPS_SSH_KNOWN_HOSTS is missing"; exit 1; }
          if [[ -n "$GHCR_TOKEN" && -z "$GHCR_USERNAME" ]]; then
            echo "GHCR_USERNAME is required when GHCR_TOKEN is configured"
            exit 1
          fi
          if [[ -n "$GHCR_USERNAME" && ! "$GHCR_USERNAME" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "GHCR_USERNAME is invalid"
            exit 1
          fi

      - name: Prepare pinned SSH identity
        shell: bash
        run: |
          install -m 700 -d "$RUNNER_TEMP/vulnflow-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vulnflow-ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vulnflow-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/vulnflow-ssh/id" "$RUNNER_TEMP/vulnflow-ssh/known_hosts"

      - name: Prepare immutable release manifest
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.publish_images.outputs.backend_image }}
          AGENT_IMAGE: ${{ needs.publish_images.outputs.agent_image }}
          WEB_IMAGE: ${{ needs.publish_images.outputs.web_image }}
        run: |
          printf 'VULNFLOW_BACKEND_IMAGE=%s\nVULNFLOW_AGENT_IMAGE=%s\nVULNFLOW_WEB_IMAGE=%s\nVULNFLOW_RELEASE_SHA=%s\n' \
            "$BACKEND_IMAGE" "$AGENT_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" > "$RUNNER_TEMP/vulnflow-release.env"
          chmod 600 "$RUNNER_TEMP/vulnflow-release.env"

      - name: Synchronize deployment files
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/vulnflow-ssh/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vulnflow-ssh/known_hosts" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          deploy_root=$1
          install -d -m 750 "$deploy_root/deploy"
          REMOTE

          rsync -az --delete \
            -e "ssh -i '$RUNNER_TEMP/vulnflow-ssh/id' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$RUNNER_TEMP/vulnflow-ssh/known_hosts' -p '$VPS_PORT'" \
            deploy/ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/deploy/"

          scp -i "$RUNNER_TEMP/vulnflow-ssh/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vulnflow-ssh/known_hosts" \
            -P "$VPS_PORT" \
            "$RUNNER_TEMP/vulnflow-release.env" \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/.release.next.env"

      - name: Authenticate VPS to GHCR when configured
        if: env.GHCR_TOKEN != ''
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$RUNNER_TEMP/vulnflow-ssh/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vulnflow-ssh/known_hosts" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Deploy and verify release
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/vulnflow-ssh/id" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vulnflow-ssh/known_hosts" \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            bash "$VPS_DEPLOY_PATH/deploy/deploy.sh" "$VPS_DEPLOY_PATH/.release.next.env"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/vulnflow-ssh" "$RUNNER_TEMP/vulnflow-release.env"
