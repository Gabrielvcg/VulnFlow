name: VulnFlow CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            agent/pom.xml

      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Require PostgreSQL integration tests
        working-directory: backend
        run: |
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/failsafe-reports/TEST-*.xml")
          tests = 0
          skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              tests += int(root.attrib.get("tests", 0))
              skipped += int(root.attrib.get("skipped", 0))

          print(f"Failsafe integration tests: total={tests}, skipped={skipped}")
          if tests == 0 or skipped != 0:
              sys.exit("PostgreSQL integration tests did not all run")
          PY

      - name: Verify agent
        working-directory: agent
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build backend image
        run: docker build --tag vulnflow-backend:ci backend

      - name: Build agent image
        run: docker build --tag vulnflow-agent:ci agent
