spring:
  application:
    name: vulnflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vulnflow}
    username: ${SPRING_DATASOURCE_USERNAME:vulnflow}
    password: ${SPRING_DATASOURCE_PASSWORD:local-vulnflow-password}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${VULNFLOW_MAX_FILE_SIZE:10MB}
      max-request-size: ${VULNFLOW_MAX_FILE_SIZE:10MB}
  data:
    web:
      pageable:
        max-page-size: 100
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never

server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
  servlet:
    session:
      cookie:
        name: VULNFLOW_SESSION
        http-only: true
        secure: ${VULNFLOW_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vulnflow:
  ingestion:
    max-file-size: ${VULNFLOW_MAX_FILE_SIZE:10MB}
    max-description-length: ${VULNFLOW_MAX_DESCRIPTION_LENGTH:8000}
  report-storage:
    directory: ${VULNFLOW_REPORT_STORAGE_DIRECTORY:./data/reports}
  worker:
    enabled: ${VULNFLOW_WORKER_ENABLED:true}
    poll-interval: ${VULNFLOW_WORKER_POLL_INTERVAL:2s}
    batch-size: ${VULNFLOW_WORKER_BATCH_SIZE:5}
    max-attempts: ${VULNFLOW_WORKER_MAX_ATTEMPTS:3}
    stale-timeout: ${VULNFLOW_WORKER_STALE_TIMEOUT:15m}
    backoff: ${VULNFLOW_WORKER_BACKOFF:5s,30s,2m}
  aws:
    region: ${AWS_REGION:eu-west-1}
    s3-bucket: ${VULNFLOW_S3_BUCKET:}
    s3-prefix: ${VULNFLOW_S3_PREFIX:reports}
    sqs-queue-url: ${VULNFLOW_SQS_QUEUE_URL:}
    dynamodb-table: ${VULNFLOW_DYNAMODB_TABLE:}
    dynamodb-max-findings: ${VULNFLOW_DYNAMODB_MAX_FINDINGS:100000}
    max-payload-bytes: ${VULNFLOW_MAX_PAYLOAD_BYTES:10485760}
    api-call-timeout: ${VULNFLOW_AWS_API_TIMEOUT:10s}
    connection-timeout: ${VULNFLOW_AWS_CONNECTION_TIMEOUT:3s}
    outbox:
      enabled: ${VULNFLOW_AWS_OUTBOX_ENABLED:true}
      poll-interval: ${VULNFLOW_AWS_OUTBOX_POLL_INTERVAL:2s}
      batch-size: ${VULNFLOW_AWS_OUTBOX_BATCH_SIZE:10}
      max-attempts: ${VULNFLOW_AWS_OUTBOX_MAX_ATTEMPTS:5}
      stale-timeout: ${VULNFLOW_AWS_OUTBOX_STALE_TIMEOUT:2m}
      backoff: ${VULNFLOW_AWS_OUTBOX_BACKOFF:5s,30s,2m,10m}
  security:
    api-key:
      value: ${VULNFLOW_API_KEY:}
  ui:
    enabled: ${VULNFLOW_UI_ENABLED:false}
    scans-enabled: ${VULNFLOW_UI_SCANS_ENABLED:false}
    sqs-telemetry-enabled: ${VULNFLOW_UI_SQS_TELEMETRY_ENABLED:false}
    bootstrap-username: ${VULNFLOW_UI_BOOTSTRAP_USERNAME:}
    bootstrap-password-hash: ${VULNFLOW_UI_BOOTSTRAP_PASSWORD_HASH:}
    agent-offline-after: ${VULNFLOW_UI_AGENT_OFFLINE_AFTER:45s}
    claim-lease: ${VULNFLOW_UI_CLAIM_LEASE:2m}
    request-expiry: ${VULNFLOW_UI_REQUEST_EXPIRY:30m}
    target-cooldown: ${VULNFLOW_UI_TARGET_COOLDOWN:10m}
    queue-capacity: ${VULNFLOW_UI_QUEUE_CAPACITY:25}
    max-hourly-per-user: ${VULNFLOW_UI_MAX_HOURLY_PER_USER:5}
    max-daily-per-user: ${VULNFLOW_UI_MAX_DAILY_PER_USER:20}
    max-recovery-attempts: ${VULNFLOW_UI_MAX_RECOVERY_ATTEMPTS:2}
    agent-min-free-bytes: ${VULNFLOW_UI_AGENT_MIN_FREE_BYTES:536870912}

logging:
  structured:
    format:
      console: ecs
  level:
    org.hibernate.SQL: warn
