spring:
  application:
    name: vulnflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vulnflow}
    username: ${SPRING_DATASOURCE_USERNAME:vulnflow}
    password: ${SPRING_DATASOURCE_PASSWORD:local-vulnflow-password}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${VULNFLOW_MAX_FILE_SIZE:10MB}
      max-request-size: ${VULNFLOW_MAX_FILE_SIZE:10MB}
  data:
    web:
      pageable:
        max-page-size: 100

server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vulnflow:
  ingestion:
    max-file-size: ${VULNFLOW_MAX_FILE_SIZE:10MB}
    processing-timeout: ${VULNFLOW_PROCESSING_TIMEOUT:15m}
    max-description-length: ${VULNFLOW_MAX_DESCRIPTION_LENGTH:8000}
  security:
    api-key:
      value: ${VULNFLOW_API_KEY:}

logging:
  structured:
    format:
      console: ecs
  level:
    org.hibernate.SQL: warn
