services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnflow}
      POSTGRES_USER: ${POSTGRES_USER:-vulnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-vulnflow-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vulnflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vulnflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vulnflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-vulnflow-password}
      VULNFLOW_MAX_FILE_SIZE: ${VULNFLOW_MAX_FILE_SIZE:-10MB}
      VULNFLOW_MAX_DESCRIPTION_LENGTH: ${VULNFLOW_MAX_DESCRIPTION_LENGTH:-8000}
      VULNFLOW_API_KEY: ${VULNFLOW_API_KEY:-local-development-only-api-key}
      VULNFLOW_REPORT_STORAGE_DIRECTORY: /var/lib/vulnflow/reports
      VULNFLOW_WORKER_ENABLED: ${VULNFLOW_WORKER_ENABLED:-true}
      VULNFLOW_WORKER_POLL_INTERVAL: ${VULNFLOW_WORKER_POLL_INTERVAL:-2s}
      VULNFLOW_WORKER_BATCH_SIZE: ${VULNFLOW_WORKER_BATCH_SIZE:-5}
      VULNFLOW_WORKER_MAX_ATTEMPTS: ${VULNFLOW_WORKER_MAX_ATTEMPTS:-3}
      VULNFLOW_WORKER_STALE_TIMEOUT: ${VULNFLOW_WORKER_STALE_TIMEOUT:-15m}
      VULNFLOW_WORKER_BACKOFF: ${VULNFLOW_WORKER_BACKOFF:-5s,30s,2m}
      VULNFLOW_UI_ENABLED: ${VULNFLOW_UI_ENABLED:-false}
      VULNFLOW_UI_SCANS_ENABLED: ${VULNFLOW_UI_SCANS_ENABLED:-false}
      VULNFLOW_UI_BOOTSTRAP_USERNAME: ${VULNFLOW_UI_BOOTSTRAP_USERNAME:-}
      VULNFLOW_UI_BOOTSTRAP_PASSWORD_HASH: ${VULNFLOW_UI_BOOTSTRAP_PASSWORD_HASH:-}
      VULNFLOW_SESSION_COOKIE_SECURE: ${VULNFLOW_SESSION_COOKIE_SECURE:-false}
    volumes:
      - vulnflow-report-data:/var/lib/vulnflow/reports
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  vulnflow-postgres-data:
  vulnflow-report-data:
