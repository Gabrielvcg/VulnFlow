services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnflow}
      POSTGRES_USER: ${POSTGRES_USER:-vulnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-vulnflow-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vulnflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vulnflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vulnflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-vulnflow-password}
      VULNFLOW_MAX_FILE_SIZE: ${VULNFLOW_MAX_FILE_SIZE:-10MB}
      VULNFLOW_PROCESSING_TIMEOUT: ${VULNFLOW_PROCESSING_TIMEOUT:-15m}
      VULNFLOW_MAX_DESCRIPTION_LENGTH: ${VULNFLOW_MAX_DESCRIPTION_LENGTH:-8000}
      VULNFLOW_API_KEY: ${VULNFLOW_API_KEY:-local-development-only-api-key}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  vulnflow-postgres-data:
